[project]
name = "forpost-connectors"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "forpost-domain",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forpost_connectors"]