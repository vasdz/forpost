[project]
name = "forpost-prediction-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "forpost-domain",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "scikit-learn==1.9.1",
    "skops==0.15.0",
    "PyYAML>=6.0,<7"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forpost_prediction_core"]
