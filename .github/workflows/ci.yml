name: Forpost CI/CD & Security Gates

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: 1. Анализ синтаксиса и форматирования (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Linter & Formatter Check)
        run: |
          ruff check .
          ruff format --check .

  security-gates:
    name: 2. Контроль безопасности (SAST, SCA, Semgrep)
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Core & Workspace Packages
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit semgrep hatchling editables
          pip install pydantic fastapi slowapi starlette openpyxl pandas
          pip install --no-build-isolation -e ./packages/domain -e ./packages/prediction -e ./packages/connectors -e ./packages/platform -e ./apps/api

      - name: Run SAST (Bandit)
        run: |
          bandit -r apps packages -c .bandit.yaml

      - name: Run SCA (Pip-Audit)
        run: |
          pip-audit --desc

      - name: Run Semgrep (OWASP Top-10 & Secrets)
        run: |
          semgrep scan --config "p/security-audit" --config "p/secrets" --error apps packages

  unit-and-integration-tests:
    name: 3. Тестирование контрактов и моделей (Pytest)
    runs-on: ubuntu-latest
    needs: security-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling editables pytest httpx fastapi slowapi uvicorn pydantic pandas openpyxl
          pip install --no-build-isolation -e ./packages/domain -e ./packages/prediction -e ./packages/connectors -e ./packages/platform -e ./apps/api

      - name: Run Test Suite (Contracts, CDR, ABAC, WORM Ledger)
        run: |
          pytest tests -v