# Локальные параметры ML-контура; артефакты и результаты сохраняются вне Git.
seed: 20260915
feature_schema_version: "6"
label_strategy: "cadence_adjusted_silence_horizon_proxy_v2"
horizon_hours: 24
# 192 вложенные label-free точки сохраняют все anchors v6 и повышают class/time support.
cutoff_count: 192
max_training_events: 3000000
feature_windows_hours: [1, 6, 24, 72, 168]
minimum_positive_examples: 50
minimum_negative_examples: 50
validation_fraction: 0.2
test_fraction: 0.2
calibration_fraction: 0.2
minimum_validation_folds: 3
# Минимум в полном допустимом development-only sweep, дающий >=50/50 во всех частях.
validation_points_per_fold: 17
purge_hours: 24
thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
# Эти значения не являются требованиями ТЗ. Для локального демонстрационного
# релиза gates работают как advisory: фактические метрики всё равно сохраняются
# в model card и показываются диспетчеру.
minimum_precision: 0.0
minimum_recall: 0.0
maximum_alert_rate: 1.0
maximum_expected_calibration_error: 1.0
maximum_brier_score: 1.0
minimum_baseline_pr_auc_delta: 0.0
operating_profiles:
  high_precision:
    minimum_precision: 0.0
    minimum_recall: 0.0
    maximum_alert_rate: 1.0
  balanced:
    minimum_precision: 0.0
    minimum_recall: 0.0
    maximum_alert_rate: 1.0
  high_recall:
    minimum_precision: 0.0
    minimum_recall: 0.0
    maximum_alert_rate: 1.0
