[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forpost"
version = "0.1.0"
description = "Платформа предиктивного мониторинга объектов КИИ Москоллектор"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "data",
    "docs",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
exclude = ["ml/**", "models/**", "notebooks/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/api/src",
    "packages/domain/src",
    "packages/prediction/src",
    "packages/connectors/src",
    "packages/platform/src"
]
